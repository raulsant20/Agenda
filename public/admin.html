<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Agenda · Administración</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login -->
  <div class="wrap" id="loginView" hidden>
    <form class="card login" id="loginForm">
      <h1>Ingresar</h1>
      <label for="user">Usuario</label>
      <input id="user" name="user" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p class="error" id="loginErr"></p>
      <div class="actions"><button class="primary" type="submit">Entrar</button></div>
    </form>
  </div>

  <!-- Agenda -->
  <div class="wrap" id="adminView" hidden>
    <header class="top">
      <div>
        <h1>Mi agenda</h1>
        <p class="subtitle">Tocá un horario para reservarlo o editarlo</p>
      </div>
      <div class="row">
        <a class="btn" href="/" target="_blank">Ver página pública</a>
        <button id="settingsBtn" type="button">Horarios</button>
        <button id="logout" type="button">Salir</button>
      </div>
    </header>
    <div class="toolbar">
      <button id="prev" type="button" aria-label="Semana anterior">‹</button>
      <button id="today" type="button">Esta semana</button>
      <button id="next" type="button" aria-label="Semana siguiente">›</button>
      <span class="range" id="range"></span>
      <div class="legend"><span class="l-free">Libre</span><span class="l-booked">Clase</span><span class="l-blocked">Bloqueado</span></div>
    </div>
    <main id="week" class="week"></main>
    <p class="error" id="err"></p>
  </div>

  <!-- Diálogo de reserva -->
  <dialog id="bookingDlg">
    <form id="bookingForm" method="dialog">
      <h3 id="bTitle"></h3>
      <p class="hint" id="bWhen"></p>
      <label>Tipo</label>
      <div class="seg">
        <label><input type="radio" name="type" value="booking" checked> Clase</label>
        <label><input type="radio" name="type" value="blocked"> Bloquear hora</label>
      </div>
      <div id="nameRow">
        <label for="bName">Nombre del alumno</label>
        <input id="bName" maxlength="100" autocomplete="off">
      </div>
      <label for="bNote">Nota (opcional, solo vos la ves)</label>
      <textarea id="bNote" maxlength="300"></textarea>
      <div id="repeatRow">
        <label for="bRepeat">Repetir semanalmente</label>
        <select id="bRepeat">
          <option value="1">No repetir</option>
          <option value="4">4 semanas</option>
          <option value="8">8 semanas</option>
          <option value="12">12 semanas</option>
          <option value="16">16 semanas</option>
          <option value="26">26 semanas</option>
        </select>
      </div>
      <p class="error" id="bErr"></p>
      <div class="actions">
        <button type="button" class="danger" id="bDelete" hidden>Liberar</button>
        <button type="button" class="danger" id="bDeleteSeries" hidden>Liberar esta y siguientes</button>
        <button type="button" id="bCancel">Cancelar</button>
        <button type="submit" class="primary" id="bSave">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Diálogo de horarios -->
  <dialog id="settingsDlg">
    <form id="settingsForm" method="dialog">
      <h3>Horarios de atención</h3>
      <label for="sTitle">Título de la página</label>
      <input id="sTitle" maxlength="80">
      <label for="sSlot">Duración de cada clase</label>
      <select id="sSlot">
        <option value="30">30 minutos</option><option value="45">45 minutos</option>
        <option value="60">1 hora</option><option value="90">1 h 30 min</option><option value="120">2 horas</option>
      </select>
      <label>Días y horario</label>
      <div class="days-cfg" id="daysCfg"></div>
      <p class="hint">Las reservas existentes no se borran al cambiar los horarios.</p>
      <p class="error" id="sErr"></p>
      <div class="actions">
        <button type="button" id="sCancel">Cancelar</button>
        <button type="submit" class="primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="common.js"></script>
  <script src="admin.js"></script>
</body>
</html>
